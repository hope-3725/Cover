{% load static %}<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Cover{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'layouts_ui/layout_form.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="no-print">
        <a href="/layouts/">Макети</a>
        <a href="/layouts/new/">Нов макет</a>
    </nav>
    <main>
        {% if messages %}
        <ul class="messages no-print">
            {% for message in messages %}
            <li class="message {{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <script src="{% static 'layouts_ui/layout_preview.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
